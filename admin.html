<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QIVORA Owner Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brand:#6d28d9;--bg:#f6f5fb;--card:#fff;--text:#17131f;--muted:#6f687a;--line:#e9e5f1;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text)}.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.topin{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:14px}.logo{font-weight:950;font-size:25px;color:var(--brand)}.spacer{flex:1}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:#f2eff9;color:var(--text)}.danger{background:#fee2e2;color:#991b1b}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 35px rgba(31,20,55,.05);margin-top:18px}.login{max-width:460px;margin:60px auto}.h1{font-size:30px;margin:0 0 7px}.muted{color:var(--muted)}.field{margin:13px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:15px;background:#fff}.status{margin-top:12px;font-weight:700;min-height:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:18px;border:1px solid var(--line);border-radius:15px;background:#fff}.stat b{display:block;font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:flex;gap:12px}.row>*{flex:1}.actions{display:flex;gap:10px;flex-wrap:wrap}.preview{display:none;max-width:150px;max-height:150px;object-fit:cover;border-radius:12px;margin:10px 0}.products{display:grid;gap:10px}.prod{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:10px;border-radius:13px;background:#fff}.prod img{width:62px;height:62px;object-fit:cover;border-radius:10px;background:#f1eff6}.prod .info{flex:1}.prod .name{font-weight:900}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.preview-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.preview-wrap img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid #ddd}@media(max-width:720px){.stats,.grid{grid-template-columns:1fr}.row{flex-direction:column;gap:0}.topin{padding:12px}.wrap{padding:12px}.h1{font-size:25px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="logo">QIVORA</div><div class="muted">Owner Dashboard</div><div class="spacer"></div><button id="logoutTop" class="btn ghost hidden" onclick="logout()">Logout</button></div></div>
<main class="wrap">
<section id="loginCard" class="card login">
<h1 class="h1">🔐 Owner Login</h1><p class="muted">Sign in with your QIVORA owner account.</p>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Owner email"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div>
<button class="btn primary" style="width:100%" onclick="login()">Login to Dashboard</button>
<div id="loginStatus" class="status"></div>
</section>
<section id="dashboard" class="hidden">
<div class="card"><h1 class="h1">Welcome, Owner 👋</h1><p class="muted">Manage products shown on the public QIVORA website.</p></div>
<div class="stats"><div class="stat"><span class="muted">Total Products</span><b id="countProducts">0</b></div><div class="stat"><span class="muted">Categories</span><b id="countCategories">0</b></div><div class="stat"><span class="muted">Status</span><b style="font-size:18px">● Online</b></div></div>
<div class="grid">
<div class="card"><h2>Add Product</h2>
<div class="row"><div class="field"><label>Product name *</label><input id="name" placeholder="e.g. Women's Kurti"></div><div class="field"><label>Price</label><input id="price" placeholder="₹299"></div></div>
<div class="row"><div class="field"><label>Category</label><input id="category" placeholder="Fashion"></div><div class="field"><label>Product photo *</label><input id="file" type="file" accept="image/*" multiple onchange="preview()"></div></div>
<div class="field"><label>Meesho product link *</label><input id="link" type="url" placeholder="Paste Meesho link"></div>
<div id="previewWrap" class="preview-wrap"></div>
<div class="actions"><button class="btn primary" onclick="addProduct()">➕ Add Product</button><button class="btn ghost" onclick="clearForm()">Clear</button></div>
<div id="saveStatus" class="status"></div>
</div>
<div class="card"><div style="display:flex;align-items:center;gap:10px"><h2 style="margin:0">Products</h2><div class="spacer"></div><button class="btn ghost" onclick="loadProducts()">↻ Refresh</button></div><p class="muted">Delete a product if you no longer want it visible.</p><div id="products" class="products"></div><div id="listStatus" class="status"></div></div>
</div>
</section>
</main>
<script>
const SUPABASE_URL="https://dkzdgsuawotvcmemkclm.supabase.co";
const SUPABASE_KEY="sb_publishable_YBsJaTGSo8kQTAxd3Ww-ZA_Q-WMnNKy";
const OWNER_EMAIL="sameerpatel2035@gmail.com";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function setStatus(id,msg){$(id).textContent=msg||""}
async function boot(){const r=await sb.auth.getSession();const u=r.data.session?.user;if(u?.email?.toLowerCase()===OWNER_EMAIL.toLowerCase())showDashboard();else if(u)await sb.auth.signOut()}
async function login(){const email=$("email").value.trim(),password=$("password").value;setStatus("loginStatus","Signing in...");const r=await sb.auth.signInWithPassword({email,password});if(r.error){setStatus("loginStatus",r.error.message);return}if(r.data.user.email.toLowerCase()!==OWNER_EMAIL.toLowerCase()){await sb.auth.signOut();setStatus("loginStatus","This account is not the QIVORA owner account.");return}showDashboard()}
function showDashboard(){$("loginCard").classList.add("hidden");$("dashboard").classList.remove("hidden");$("logoutTop").classList.remove("hidden");loadProducts()}
async function logout(){await sb.auth.signOut();location.reload()}
function preview(){const files=[...document.getElementById("file").files],wrap=document.getElementById("previewWrap");wrap.innerHTML="";files.slice(0,4).forEach(f=>{const img=document.createElement("img");img.src=URL.createObjectURL(f);wrap.appendChild(img)})}
function clearForm(){["name","price","category","link"].forEach(id=>$(id).value="");$("file").value="";$("previewWrap").innerHTML="";setStatus("saveStatus","")}
async function addProduct(){const name=$("name").value.trim(),price=$("price").value.trim(),category=$("category").value.trim()||"Other",link=$("link").value.trim(),files=[...$("file").files].slice(0,4);if(!name||!link||!files.length){setStatus("saveStatus","Product name, photo and Meesho link are required.");return}if(!/^https?:\/\//i.test(link)){setStatus("saveStatus","Please enter a valid Meesho URL.");return}setStatus("saveStatus","Uploading photos...");const urls=[];for(let i=0;i<files.length;i++){const f=files[i],safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path=crypto.randomUUID()+"-"+safe;const up=await sb.storage.from("product-images").upload(path,f,{contentType:f.type});if(up.error){setStatus("saveStatus",up.error.message);return}urls.push(sb.storage.from("product-images").getPublicUrl(path).data.publicUrl)}setStatus("saveStatus","Saving product...");const ins=await sb.from("products").insert({name,price,category,image_url:JSON.stringify(urls),meesho_link:link});if(ins.error){setStatus("saveStatus",ins.error.message);return}setStatus("saveStatus","✅ Product added successfully with "+urls.length+" photo"+(urls.length>1?"s":"")+".");clearForm();await loadProducts()}

async function loadProducts(){setStatus("listStatus","Loading...");const r=await sb.from("products").select("id,name,price,category,image_url,meesho_link,created_at").order("created_at",{ascending:false});if(r.error){setStatus("listStatus",r.error.message);return}const arr=r.data||[];$("countProducts").textContent=arr.length;$("countCategories").textContent=new Set(arr.map(x=>x.category||"Other")).size;$("products").innerHTML=arr.length?arr.map(p=>`<div class="prod"><img src="${esc(p.image_url||"")}" onerror="this.style.visibility='hidden'"><div class="info"><div class="name">${esc(p.name)}</div><div class="small">${esc(p.category||"Other")} • ${esc(p.price||"Price not set")}</div></div><button class="btn danger" onclick="removeProduct('${p.id}')">Delete</button></div>`).join(""):`<div class="muted">No products yet.</div>`;setStatus("listStatus","")}
async function removeProduct(id){if(!confirm("Delete this product?"))return;const r=await sb.from("products").delete().eq("id",id);if(r.error){alert(r.error.message);return}await loadProducts()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
boot();
</script>
</body></html>
